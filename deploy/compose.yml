# Persec behind Caddy, which gets a free HTTPS certificate automatically.
# HTTPS is required: the proxy's service workers don't run on plain http.
# Settings live in deploy/.env, which setup.sh creates.

name: persec

services:
  persec:
    # Named so `persec rollback` can swap back to the previous build (setup.sh keeps it).
    image: persec:latest
    build:
      context: ..
      # Interpolated from deploy/.env so the client bundle and the server agree on the path.
      args:
        PUBLIC_PERSEC_WISP_PATH: ${PUBLIC_PERSEC_WISP_PATH:-}
        PUBLIC_PERSEC_URL_KEY: ${PUBLIC_PERSEC_URL_KEY:-}
        PUBLIC_PERSEC_PROXY_KEY: ${PUBLIC_PERSEC_PROXY_KEY:-}
        PUBLIC_PERSEC_SCRUB: ${PUBLIC_PERSEC_SCRUB:-}
        PUBLIC_PERSEC_MASK_TEXT: ${PUBLIC_PERSEC_MASK_TEXT:-}
    restart: unless-stopped
    # The image's health check (/healthz) marks it unhealthy in `docker ps` if it stops answering.
    env_file: .env
    environment:
      # Caddy always overwrites this header with the visitor's real address (see Caddyfile).
      PERSEC_CLIENT_IP_HEADER: cf-connecting-ip
    # Not published to the internet: only Caddy can reach it.
    expose:
      - "8080"
    # Saved-login backups (encrypted in the browser), kept across updates.
    volumes:
      - persec_data:/app/data
    # On a small server, a runaway Persec is stopped (and restarted by restart: above) before the
    # system has to kill something else, such as Caddy, Docker or SSH. Sized for a 1 GB server; set
    # PERSEC_MEMORY_LIMIT in .env on a bigger one. Equal limits mean it can't push the server into swap.
    mem_limit: ${PERSEC_MEMORY_LIMIT:-640m}
    memswap_limit: ${PERSEC_MEMORY_LIMIT:-640m}
    # Docker keeps container logs forever otherwise.
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - persec
    logging: *logging

volumes:
  persec_data:
  caddy_data:
  caddy_config:
