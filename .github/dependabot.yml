version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # The proxy engines and their transports. A bump here can pass the build and still break
      # proxying at runtime (wisp-js 0.5.1 regressed DNS, #12), so review and device-test them
      # together in one PR rather than five separate ones.
      proxy-engines:
        patterns:
          - "@titaniumnetwork-dev/*"
          - "@mercuryworkshop/*"
    ignore:
      # 0.5.1 breaks DNS resolution (resolve_with_fallback indexes the pending promise; see #12).
      # Stay on 0.4.x until upstream fixes it.
      - dependency-name: "@mercuryworkshop/wisp-js"
        versions: [">=0.5.0"]
