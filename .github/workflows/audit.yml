name: Dependency Audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # New advisories appear without any code change, so check weekly too.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Reads only the lockfile, so no install is needed.
      - name: Report all advisories
        run: pnpm audit || true
      - name: Fail on high or critical
        run: pnpm audit --audit-level high
