name: Build Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The runner's cached 22.x can lag behind; Astro 7 needs >=22.23.4, like the Dockerfile's image.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Fails on unformatted code; fix locally with `pnpm format`.
      - run: pnpm exec prettier --check .
      - run: pnpm test
      # Also type-checks every file (astro check) before building.
      - run: pnpm build
