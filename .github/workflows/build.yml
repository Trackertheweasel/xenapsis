name: Build Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The exact version Astro needs as a minimum, shared with nvm and the devcontainer.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Fails on unformatted code; fix locally with `pnpm format`.
      - run: pnpm exec prettier --check .
      - run: pnpm test
      # Also type-checks every file (astro check) before building.
      - run: pnpm build

  # The image is what setup.sh and Render actually run, so build it and check that it serves.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker build -t persec:ci .
      - name: Start it invite-only, as a deploy would
        run: >
          docker run -d --name persec -p 8080:8080
          -e PERSEC_INVITE_CODES=ci:ci-code-123 -e PERSEC_SECRET=ci-secret-0123456789
          persec:ci
      - name: Wait for the health check, then check the sign-in page
        run: |
          for i in $(seq 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' persec)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' persec | grep -qx healthy
          curl -fsS http://localhost:8080/enter >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/query?q=x)" = 401
      - name: Stops cleanly on SIGTERM
        run: |
          docker stop persec
          test "$(docker inspect -f '{{.State.ExitCode}}' persec)" = 0
      - if: failure()
        run: docker logs persec
