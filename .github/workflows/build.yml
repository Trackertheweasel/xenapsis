name: Build Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 8 can't read the v9 lockfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Fails on unformatted code; fix locally with `pnpm format`.
      - run: pnpm exec prettier --check .
      - run: pnpm test
      # Also type-checks every file (astro check) before building.
      - run: pnpm build
