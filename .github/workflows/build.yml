name: Build Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # The runner's cached 22.x can lag behind; Astro 7 needs >=22.23.4, like the Dockerfile's image.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Fails on unformatted code; fix locally with `pnpm format`.
      - run: pnpm exec prettier --check .
      - run: pnpm test
      # Also type-checks every file (astro check) before building.
      - run: pnpm build
